# bp08_semantic_ruleset.cfg v1.0-E0
# 语义校验机读规则，UTF-8 LF
# 禁止词列表
forbidden_words = ["导致","根源","因此","故而","缺陷本质","根本矛盾","三元优于","无法解决","根治","绝症","终结"]

# 句法匹配正则：现象描述后面紧跟指示类动词+机理结论
pattern_causal_syntax = /现象.*(指示|表明|说明|揭示).*机理/

# 规则说明
# 匹配命中：SEMANTIC_RISK；强命中直接BOUNDARY_BREACH
# 自然语言文档仅人工参考，脚本以此cfg为准
# 修改本文件需要更新版本号+sha256，改动拦截逻辑需要发布影响评估报告
