core_axioms:
- 结构相似 ≠ 机制相同
- 机制相同 ≠ 性能更优
- 性能更优 ≠ 历史同源
- 局部有效 ≠ 普遍规律
research_question: '能否从特定先天易学图式中提取明确离散结构，转化为现代形式化模型， 通过公平对照实验判断这些结构是否为神经符号AI、时序预测或动态控制
  提供独立的性能增益？

  '
forbidden_presuppositions:
- 不预设六十四卦具备宇宙级完备性
- 不预设阴阳等价于熵
- 不预设古典图式与现代计算理论历史同源
- 不预设该结构天然优于其他先验
built_in_constraints:
- id: C1
  constraint: T函数未定义，FSM/LTL/马尔可夫对位降格为候选对位框架
  hard_gate: 一级基座首交付项=T函数+步进语义+64×64跃迁掩码
- id: C2
  constraint: 历史源流B级标注 historicity_note，禁止无约束"上古原生"口径
- id: C3
  constraint: 统一内核四条式为充分条件框架，非排他唯一内核
- id: C4
  constraint: '强绝对修辞挂载 rhetoric_layer: qualified_comment'
- id: C5
  constraint: BL盲区限定域——主流LLM训练管线未内置该类稳态先验，不否定控制论既有成果
research_layers:
  L1_符号层: 只定义不阐释
  L2_数学层: 只建模不升华（状态空间{0,1}^6 / 邻接图G=(Q,E) / 汉明距离 / T待标定）
  L3_逻辑层: 只规约不匹配（候选LTL约束集，不预设天然匹配）
  L4_机制层: 只假设不定论
  L5_实验层: 只对照不偏爱
  L6_证据层: 只分级不打包（五链路互不背书：历史/数学/机制/工程/价值）
