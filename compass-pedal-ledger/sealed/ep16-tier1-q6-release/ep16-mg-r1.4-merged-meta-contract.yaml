  H-AI-02:
    claim: 古典周期拓扑先验改善周期类时序任务抗漂移与预测稳定性
    scope: 具备真实周期结构任务；非周期场景自动失效
    controls:
    - 非周期负对照
    - 周期突变负对照
    - 异常扰动负对照
    state: HYPOTHESIS_PENDING_TEST
  H-AI-03:
